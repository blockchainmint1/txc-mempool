# texitcoind config — minimal, tuned for serving an indexer + mempool backend.
# RPC creds come from the container env (overridden by docker-compose).

server=1
daemon=0
listen=1
txindex=1
blockfilterindex=1
peerbloomfilters=1

# RPC — only reachable inside the docker network.
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
# Deep queue + more threads: "Work queue depth exceeded" is what a full queue
# looks like from the client side, and it surfaces as a 500 in the API.
rpcworkqueue=256
rpcthreads=32
# Larger UTXO cache means fewer disk reads per block/tx lookup, which is the
# real reason the queue backs up during traffic bursts.
dbcache=2048

# ZMQ — mempool/backend will subscribe for instant tx/block events.
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
zmqpubhashblock=tcp://0.0.0.0:28334

# Mempool — keep generous so the explorer has plenty to show.
maxmempool=600
mempoolexpiry=336
maxconnections=80

# Logs
debug=0
shrinkdebugfile=1
