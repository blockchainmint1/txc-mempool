# nginx reverse proxy in front of the mempool backend.
# - terminates TLS (certs from certbot)
# - forwards /api and /api/v1/ws to mempool-api:8999
# - upgrades WS connections properly
#
# $DOMAIN is substituted at container start via envsubst.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---------- Edge micro-cache ----------
  # Collapses bursts of identical polls (tip height, supply) into a single
  # upstream call. `use_temp_path=off` avoids a cross-filesystem move on
  # cache write. `proxy_cache_lock on` in each location makes concurrent
  # cache misses share ONE upstream fetch instead of stampeding.
  proxy_cache_path /var/cache/nginx/txc levels=1:2
                   keys_zone=txc_cache:10m
                   max_size=100m
                   inactive=10m
                   use_temp_path=off;
  proxy_cache_key "$scheme$request_method$host$request_uri";

  # ---------- Wallet version check (fail-fast, never force an update) --------
  # The mobile wallet pings wallet-versions.<domain> at startup. While that
  # name didn't resolve, the request sat there until the socket timed out and
  # the app's update gate blocked the UI. Now the name points here and we
  # answer instantly with "you're up to date", in every field shape the
  # legacy clients are known to read. Served on both 80 and TLS below.
  server {
    listen 80;
    server_name wallet-versions.$DOMAIN;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      default_type application/json;
      add_header Cache-Control "public, max-age=300" always;
      add_header Access-Control-Allow-Origin "*" always;
      return 200 '{"forceUpdate":false,"force_update":false,"updateRequired":false,"update_required":false,"latestVersion":"0.0.0","minVersion":"0.0.0","minimumVersion":"0.0.0","version":"0.0.0","ios":{"version":"0.0.0","latestVersion":"0.0.0","minVersion":"0.0.0","forceUpdate":false},"android":{"version":"0.0.0","latestVersion":"0.0.0","minVersion":"0.0.0","forceUpdate":false},"message":"","url":""}';
    }
  }

  server {
    # TLS twin of the block above; 8443 because the SNI router owns 443.
    listen 127.0.0.1:8443 ssl http2;
    server_name wallet-versions.$DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      default_type application/json;
      add_header Cache-Control "public, max-age=300" always;
      add_header Access-Control-Allow-Origin "*" always;
      return 200 '{"forceUpdate":false,"force_update":false,"updateRequired":false,"update_required":false,"latestVersion":"0.0.0","minVersion":"0.0.0","minimumVersion":"0.0.0","version":"0.0.0","ios":{"version":"0.0.0","latestVersion":"0.0.0","minVersion":"0.0.0","forceUpdate":false},"android":{"version":"0.0.0","latestVersion":"0.0.0","minVersion":"0.0.0","forceUpdate":false},"message":"","url":""}';
    }
  }

  # ---------- HTTP → HTTPS + ACME challenge ----------
  server {
    listen 80;
    server_name $DOMAIN;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }


  # ---------- HTTPS ----------
  server {
    # 8443, NOT 443: port 443 is owned by the SNI router in the stream{} block
    # at the bottom of this file, which forwards electrum*.<domain> to the
    # Electrum shim and everything else back here. If this ever says 443 again,
    # two listeners fight over the port and TLS handshakes fail at random.
    listen 127.0.0.1:8443 ssl http2;
    server_name $DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # CORS — the explorer frontend lives on a different origin.
    # The indexer emits its own CORS headers; if we let those through as well
    # the browser sees TWO Access-Control-Allow-Origin values and rejects the
    # response with an opaque "Failed to fetch". Strip upstream's copies first
    # (proxy_hide_header is inherited by every location below), then add ours.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;


    # WebSocket — must come before the /api block.
    location /api/v1/ws {
      proxy_pass http://mempool-api:8999/api/v1/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }


    # ---------- Hot-path micro-cache ----------
    # These two endpoints get polled in tight loops (once every ~2s for the
    # tip height by every explorer client; once every ~2s for supply by an
    # internal Node script). Exact-match `=` beats regex, so these win over
    # the generic address/blocks handlers below.
    #
    # `proxy_cache_lock on` = only ONE upstream request per key while others
    # wait for it to fill the cache — the burst-collapse behaviour we want.
    # `use_stale updating` = keep serving the last good body during refresh.

    # Tip height — changes at most once per block (~3 min). 2s TTL is enough
    # to collapse every browser's polling loop into one upstream call.
    location = /api/v1/blocks/tip/height {
      proxy_pass http://indexer:3001/blocks/tip/height;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache            txc_cache;
      proxy_cache_valid 200  2s;
      proxy_cache_lock       on;
      proxy_cache_use_stale  updating error timeout;
      # add_header in a location DISCARDS inherited add_headers, so the CORS
      # trio from the server block must be repeated here or the browser
      # rejects the response with an opaque "Failed to fetch".
      add_header Access-Control-Allow-Origin  "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }
    location = /api/blocks/tip/height {
      proxy_pass http://indexer:3001/blocks/tip/height;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache            txc_cache;
      proxy_cache_valid 200  2s;
      proxy_cache_lock       on;
      proxy_cache_use_stale  updating error timeout;
      # add_header in a location DISCARDS inherited add_headers, so the CORS
      # trio from the server block must be repeated here or the browser
      # rejects the response with an opaque "Failed to fetch".
      add_header Access-Control-Allow-Origin  "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Supply — expensive (walks UTXO set), rarely changes. 30s TTL.
    location = /api/v1/address/_supply {
      proxy_pass http://indexer:3001/address/_supply;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache            txc_cache;
      proxy_cache_valid 200  30s;
      proxy_cache_lock       on;
      proxy_cache_use_stale  updating error timeout;
      # add_header in a location DISCARDS inherited add_headers, so the CORS
      # trio from the server block must be repeated here or the browser
      # rejects the response with an opaque "Failed to fetch".
      add_header Access-Control-Allow-Origin  "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }
    location = /api/address/_supply {
      proxy_pass http://indexer:3001/address/_supply;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache            txc_cache;
      proxy_cache_valid 200  30s;
      proxy_cache_lock       on;
      proxy_cache_use_stale  updating error timeout;
      # add_header in a location DISCARDS inherited add_headers, so the CORS
      # trio from the server block must be repeated here or the browser
      # rejects the response with an opaque "Failed to fetch".
      add_header Access-Control-Allow-Origin  "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Address endpoints — served by our custom indexer, not mempool-api.
    # Matches /api/address/..., /api/v1/address/..., and also the bare
    # Esplora-style /address/... used by some tooling.
    location ~ ^/api/(?:v1/)?address/(.*)$ {
      proxy_pass http://indexer:3001/address/$1$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache_valid 200 5s;
    }

    # Esplora REST — blocks, tx reads, mempool, fee-estimates — all served by
    # our indexer (mempool-api in MEMPOOL_BACKEND=none mode doesn't expose them).
    # Matches both bare /api/<x> and /api/v1/<x> for client compatibility.
    location ~ ^/api/(?:v1/)?(blocks|block|block-height|mempool|fee-estimates)(/.*)?$ {
      proxy_pass http://indexer:3001/$1$2$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache_valid 200 5s;
    }

    # Read-only tx endpoints (full tx, status, outspends) — also our indexer.
    # POST /tx and /tx/:txid/hex have their own exact-match blocks below.
    location ~ "^/api/(?:v1/)?tx/([0-9a-fA-F]{64})(/(?:status|outspends|merkle-proof|merkleblock-proof))?$" {
      proxy_pass http://indexer:3001/tx/$1$2$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache_valid 200 5s;
    }

    # Broadcast (POST raw hex) — goes to our indexer, which talks to texitcoind
    # via JSON-RPC sendrawtransaction. mempool-api in MEMPOOL_BACKEND=none mode
    # doesn't accept POST /tx, so we own it here.
    # Same as above but under /api/v1/ — the swap project (and most
    # Esplora clients now) use this prefix.
    location = /api/v1/tx {
      proxy_pass http://indexer:3001/tx;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location ~ "^/api/v1/tx/([0-9a-fA-F]{64})/hex$" {
      proxy_pass http://indexer:3001/tx/$1/hex;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache_valid 200 30s;
    }

    location = /api/tx {
      proxy_pass http://indexer:3001/tx;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Raw tx hex — used by signers to fetch prevout scripts.
    location ~ "^/api/tx/([0-9a-fA-F]{64})/hex$" {
      proxy_pass http://indexer:3001/tx/$1/hex;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache_valid 200 30s;
    }


    # REST — everything else under /api/ goes to mempool-api.
    location /api/ {
      proxy_pass http://mempool-api:8999/api/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;

      # tiny edge cache for the heavy/rarely-changing endpoints
      proxy_cache_valid 200 5s;
    }

    # Root — point to the Lovable-published frontend, or serve a redirect.
    location / {
      return 302 https://mempool-heart-explorer.lovable.app/;
    }
  }
}

# --- SNI router on 443 -----------------------------------------------------
# electrum*.<domain>:443 is raw Electrum TLS for the wallet app; everything
# else is the normal HTTPS API terminated by the vhost above on 127.0.0.1:8443.
stream {
    # Log the original client IP and requested SNI hostname. The Electrum shim
    # sees nginx as its peer for port-443 traffic, so this is the authoritative
    # record of whether an iPhone reached the box at all.
    log_format txc_stream '$time_iso8601 remote=$remote_addr:$remote_port '
                          'sni=$ssl_preread_server_name upstream=$txc_upstream '
                          'status=$status sent=$bytes_sent received=$bytes_received '
                          'duration=$session_time';
    access_log /dev/stdout txc_stream;

    # Docker's embedded DNS. Required: a proxy_pass variable target is resolved
    # per connection, so a recreated electrum container is picked up in ~10s.
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 3s;

    # Routing rules, in priority order:
    #   ""           -> no SNI at all. iOS builds of react-native-tcp-socket
    #                   upgrade an already-connected plain socket to TLS and
    #                   send NO server_name extension, so these connections
    #                   previously fell through to the web vhost and got an
    #                   HTTP 400 — the wallet then spun forever and finally
    #                   showed "Network Error". Browsers and curl always send
    #                   SNI, so treating "no SNI" as Electrum is safe.
    #   electrum*    -> the wallet's TLS Electrum endpoint.
    #   anything else-> normal HTTPS site/API on 127.0.0.1:8443.
    map $ssl_preread_server_name $txc_upstream {
        default        "127.0.0.1:8443";
        ""             "electrum:50002";
        "~^electrum"   "electrum:50002";
    }


    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $txc_upstream;
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }
}
