# TXC explorer backend. Node (texitcoind) runs on the HOST via node-spinner.
# Frontend points at https://${DOMAIN}/api + wss://${DOMAIN}/api/v1/ws.
#
# Address-level indexing is served by our own `txc-indexer` service (see
# ./indexer/) which walks the chain via texitcoind RPC and exposes
# Esplora-compatible /address/* endpoints. The mempool backend runs in
# bitcoind-only mode (MEMPOOL_BACKEND=none) — nginx routes /api/address/*
# straight to the indexer and everything else to mempool-api.

services:
  indexer:
    build: ./indexer
    image: txc-address-indexer:latest
    container_name: txc-indexer
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RPC_URL: "http://host.docker.internal:${RPC_PORT}"
      RPC_USER: "${RPC_USER}"
      RPC_PASSWORD: "${RPC_PASSWORD}"
      DB_PATH: "/data/indexer.sqlite"
      HTTP_PORT: "3001"
      # 30s, not 5s: keeps texitcoind's RPC work queue from saturating.
      POLL_MS: "30000"
      MEMPOOL_REFRESH_MS: "15000"
    volumes:
      - ./data/indexer:/data
    expose:
      - "3001"

  # Electrum protocol front door for the TXC Wallet mobile app. Replaces the
  # standalone ElectrumX fleet — same node, same index, ~600 lines of protocol
  # translation. Raw TLS on 50002, so it bypasses nginx entirely and its DNS
  # record must NOT be Cloudflare-proxied.
  electrum:
    build: ./electrum-shim
    image: txc-electrum-shim:latest
    container_name: txc-electrum
    restart: unless-stopped
    depends_on:
      - indexer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RPC_URL: "http://host.docker.internal:${RPC_PORT}"
      RPC_USER: "${RPC_USER}"
      RPC_PASSWORD: "${RPC_PASSWORD}"
      INDEXER_DB_PATH: "/indexer/indexer.sqlite"
      MAP_DB_PATH: "/data/scripthash.sqlite"
      TLS_CERT: "/etc/letsencrypt/live/${ELECTRUM_DOMAIN:-$DOMAIN}/fullchain.pem"
      TLS_KEY: "/etc/letsencrypt/live/${ELECTRUM_DOMAIN:-$DOMAIN}/privkey.pem"
      TCP_PORT: "50001"
      TLS_PORT: "50002"
      # Per-call logging floods the log on a live wallet (an HD scan is hundreds
      # of get_balance calls). Counts are reported in the 60s health line
      # instead; flip to "true" only while debugging a specific client.
      LOG_REQUESTS: "false"
      # Stay below the wallet's own request timeout so it receives a JSON-RPC
      # error rather than reporting a generic socket/network failure.
      RPC_TIMEOUT_MS: "8000"

    volumes:
      - ./data/indexer:/indexer:ro
      - ./data/electrum:/data
      - ./data/certbot/conf:/etc/letsencrypt:ro
    ports:
      # 50002 = TLS. 50001 = plain TCP: older wallet builds (including the
      # shipped iOS app) hardcode the legacy ElectrumX port and silently hang
      # if it isn't reachable, so it must be published too.
      - "50001:50001"
      - "50002:50002"
    # "started" is not enough: after a reboot the process still needs to open
    # SQLite and bind TLS. Validate an actual Electrum round trip before nginx
    # exposes the wallet hostnames on port 443.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const tls=require('tls');
          const s=tls.connect({host:'127.0.0.1',port:50002,rejectUnauthorized:false});
          const fail=()=>process.exit(1);
          s.setTimeout(4000,fail);
          s.on('error',fail);
          s.on('secureConnect',()=>s.write('{"id":1,"method":"server.version","params":["healthcheck","1.4"]}\n'));
          s.on('data',d=>{try{const r=JSON.parse(d.toString().trim());process.exit(r.id===1&&r.result?0:1)}catch{fail()}});
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s


  nginx:

    image: nginx:alpine
    container_name: txc-nginx
    restart: unless-stopped
    depends_on:
      indexer:
        condition: service_started
      electrum:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN}
    command: >
      /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/nginx.conf > /tmp/nginx.conf
      && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: txc-certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot
      --key-type rsa --preferred-chain 'ISRG Root X1' --quiet;
      sleep 12h & wait $${!}; done"
